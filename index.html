<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogTinder - Encuentra tu compi peludo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="banner">
        <div class="banner-content">
            <i class="fas fa-paw"></i>
            <span>Encuentra tu mejor amigo hoy!</span>
            <i class="fas fa-heart"></i>
        </div>
    </div>

    <div class="app">
        <header>
            <h1>DOG<span>TINDER</span></h1>
            <p class="subtitle">Desliza para encontrar tu compi peludo</p>
        </header>

        <div class="cards-container" id="cardsContainer">
            <div class="card" id="currentCard">
                <img id="dogImage" src="" alt="Perro">
                <div class="card-info">
                    <h2 id="dogName"></h2>
                    <p id="dogBreed"></p>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-nope" id="btnNope">
                <i class="fas fa-times"></i>
            </button>
            <button class="btn btn-like" id="btnLike">
                <i class="fas fa-heart"></i>
            </button>
        </div>

        <div class="matches" id="matchesSection" style="display:none;">
            <h3><i class="fas fa-star"></i> Tus Matches (<span id="matchCount">0</span>)</h3>
            <div id="matchesList" class="matches-list"></div>
        </div>

        <button class="btn-matches" id="btnShowMatches">
            <i class="fas fa-paw"></i> VER MATCHES
        </button>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p><i class="fas fa-heart"></i> DogTinder 2024 - Hecho con amor para peludos</p>
            <div class="footer-links">
                <a href="#"><i class="fas fa-info-circle"></i> Acerca de</a>
                <a href="#"><i class="fas fa-envelope"></i> Contacto</a>
                <a href="#"><i class="fas fa-shield-alt"></i> Privacidad</a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
